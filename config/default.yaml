# bark-segmentation — default configuration

paths:
  raw_data:        "data/raw"
  processed_data:  "data/processed"
  labels:          "data/labels"
  checkpoints:     "training/checkpoints"
  logs:            "training/logs"

preprocessing:
  num_points:       16384 #25000
  normalize:        true
  voxel_size:       null   # null to skip downsampling, e.g. 0.005 to enable it
  use_cache:        true  # set to true to load from .npy cache (requires: python main.py preprocess)
  compute_normals:  true
  ignore_boundary:  true
  boundary_margin:  0.15        # boundary margin for ambiguous labels (tuned for ~500K point clouds)
  label_threshold:  0.5

model:
  architecture:  "pointnet2_seg"
  num_classes:   2
  num_points:    16384 # 25000
  use_normals:   true
  use_rgb:       true           # enable scanner RGB channels

  sa_layers:
    - npoint: 1024
      radius: 0.1
      nsample: 32
      mlp: [32, 32, 64]
    - npoint: 256
      radius: 0.2
      nsample: 64
      mlp: [64, 64, 128]
    - npoint: 64
      radius: 0.4
      nsample: 128
      mlp: [128, 128, 256]

  fp_mlp:
    - [256, 256]
    - [256, 128]
    - [128, 128, 128]

training:
  device:          auto  # "cpu" | "cuda" | "auto" (uses CUDA if available)
  epochs:          100
  batch_size:      4
  learning_rate:   0.001
  lr_decay:        0.7
  lr_decay_step:   20
  weight_decay:    0.0001
  num_workers:     0
  val_split:       0.2
  seed:            42
  class_weights:   [1.0, 10.0]  # bark weighted 10x over wood to handle class imbalance

inference:
  model_path:         "training/checkpoints/best_model.pth"
  batch_size:         1
  output_dir:         "outputs"
  save_colored_cloud: true